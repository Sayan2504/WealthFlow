# config/recurring.yml
# Recurring tasks configuration for Rails 8 Solid Queue
production:
  sync_amfi_navs_daily:
    class: MutualFunds::SyncNavJob
    queue: default
    schedule: "0 6 * * *" # Every day at 06:00 AM IST

development:
  sync_amfi_navs_daily:
    class: MutualFunds::SyncNavJob
    queue: default
    schedule: "0 6 * * *"

