# SQLite is used only for Rails internals: users, sessions metadata, net-worth
# history, audit log, trash (undo) and background jobs.
# Your financial data itself lives in JSON files (see config.x.data_dir).
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
